<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"></helmet>
<header style="position:sticky;top:0;z-index:10;background:rgba(255,255,255,0.92);backdrop-filter:blur(10px);border-bottom:1px solid #E2E8F0;font-family:'Plus Jakarta Sans',sans-serif">
  <div style="max-width:1200px;margin:0 auto;padding:14px clamp(20px,4vw,48px);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
    <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none">
      <img src="assets/mark.png" alt="" style="height:34px;mix-blend-mode:multiply">
      <div style="display:flex;flex-direction:column;line-height:1">
        <span style="font-size:20px;font-weight:700;letter-spacing:-0.02em"><span style="color:#22105C">Rind</span><span style="color:#16A34A">Works</span></span>
        <span style="font-size:7.5px;letter-spacing:0.32em;color:#22105C;font-weight:600;margin-top:4px">FRUITFUL SOFTWARE</span>
      </div>
    </a>
    <nav style="display:flex;align-items:center;gap:clamp(12px,2.5vw,32px);flex-wrap:wrap">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
        <a href="{{ l.href }}" style="font-size:15px;font-weight:500;text-decoration:none;color:{{ l.color }};padding:6px 0;border-bottom:2px solid {{ l.border }}" style-hover="color:#22105C">{{ l.label }}</a>
      </sc-for>
    </nav>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:80},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;quickgrab&quot;,&quot;databits&quot;,&quot;about&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const L = [['quickgrab','QuickGrab','quickgrab.html'],['databits','DataBits','databits.html'],['about','About','about.html'],['contact','Contact','contact.html']];
    return { links: L.map(([k,label,href]) => ({ label, href, color: k===a ? '#22105C' : '#334155', border: k===a ? '#16A34A' : 'transparent' })) };
  }
}
</script>
</body>
</html>
