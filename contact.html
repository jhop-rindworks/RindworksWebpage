<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"><style>body{margin:0;background:#FFFFFF;color:#0F172A;font-family:'Plus Jakarta Sans',sans-serif}a{color:#22105C}a:hover{color:#16A34A}input:focus,textarea:focus{outline:none;border-color:#22105C !important;box-shadow:0 0 0 3px #E4DEF7}</style></helmet>
<div data-screen-label="Contact" style="font-family:'Plus Jakarta Sans',sans-serif;color:#0F172A;background:#FFFFFF;min-height:100vh">
  <dc-import name="Nav" active="contact" hint-size="100%,66px"></dc-import>

  <section style="max-width:1200px;margin:0 auto;padding:clamp(48px,7vw,96px) clamp(20px,4vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:clamp(40px,6vw,80px);align-items:start">
    <div style="display:flex;flex-direction:column;gap:22px;align-items:flex-start">
      <h1 style="margin:0;font-size:clamp(40px,5.6vw,64px);font-weight:800;letter-spacing:-0.035em;line-height:1.04;color:#22105C">Get in touch</h1>
      <p style="margin:0;font-size:18px;line-height:1.6;color:#334155;max-width:440px">Questions about Jack’s Picker, interest in DataBits, or a project in mind? Send us a note and we’ll get back to you.</p>
      <a href="mailto:hello@rindworks.com" style="display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;color:#22105C;text-decoration:none;margin-top:8px" style-hover="color:#16A34A"><i class="ph ph-envelope-simple" style="font-size:22px"></i>hello@rindworks.com</a>
    </div>

    <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
      <form onSubmit="{{ submit }}" style="display:flex;flex-direction:column;gap:20px;border:1px solid #E2E8F0;border-radius:20px;padding:clamp(24px,4vw,36px);box-shadow:0 12px 32px rgba(15,23,42,0.06)">
        <div style="display:flex;flex-direction:column;gap:10px">
          <span style="font-size:14px;font-weight:500;color:#334155">What’s it about?</span>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <sc-for list="{{ topics }}" as="t" hint-placeholder-count="4">
              <button type="button" onClick="{{ t.pick }}" style="font-family:inherit;font-size:14px;font-weight:500;padding:8px 14px;border-radius:999px;cursor:pointer;border:1.5px solid {{ t.border }};background:{{ t.bg }};color:{{ t.fg }}">{{ t.label }}</button>
            </sc-for>
          </div>
        </div>
        <label style="display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:500;color:#334155">Name<input required="" name="name" style="font-family:inherit;font-size:15px;padding:12px 14px;border:1px solid #CBD5E1;border-radius:10px;color:#0F172A"></label>
        <label style="display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:500;color:#334155">Email<input required="" type="email" name="email" style="font-family:inherit;font-size:15px;padding:12px 14px;border:1px solid #CBD5E1;border-radius:10px;color:#0F172A"></label>
        <label style="display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:500;color:#334155">Message<textarea required="" name="message" rows="5" style="font-family:inherit;font-size:15px;padding:12px 14px;border:1px solid #CBD5E1;border-radius:10px;color:#0F172A;resize:vertical"></textarea></label>
        <button type="submit" style="align-self:flex-start;display:flex;align-items:center;gap:8px;font-family:inherit;background:#22105C;color:#FFFFFF;border:none;font-size:15px;font-weight:500;padding:13px 22px;border-radius:10px;cursor:pointer" style-hover="background:#34207F">Send message <i class="ph ph-arrow-right"></i></button>
      </form>
    </sc-if>
    <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;gap:14px;align-items:flex-start;border-radius:20px;padding:clamp(24px,4vw,36px);background:#E6F6EC">
        <i class="ph ph-check-circle" style="font-size:36px;color:#16A34A"></i>
        <h2 style="margin:0;font-size:24px;font-weight:700;color:#22105C">Thanks, message sent.</h2>
        <p style="margin:0;font-size:16px;line-height:1.6;color:#334155">We’ll reply to you by email soon.</p>
        <button type="button" onClick="{{ reset }}" style="font-family:inherit;background:none;border:none;padding:0;font-size:15px;font-weight:600;color:#22105C;text-decoration:underline;text-underline-offset:4px;cursor:pointer">Send another</button>
      </div>
    </sc-if>
  </section>

  <dc-import name="Footer" show-cta="{{ false }}" hint-size="100%,220px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { topic: 'Jack’s Picker', sent: false };
  renderVals() {
    const T = ['Jack’s Picker', 'DataBits', 'Custom project', 'Something else'];
    return {
      topics: T.map(label => {
        const on = label === this.state.topic;
        return { label, border: on ? '#22105C' : '#CBD5E1', bg: on ? '#22105C' : '#FFFFFF', fg: on ? '#FFFFFF' : '#334155', pick: () => this.setState({ topic: label }) };
      }),
      sent: this.state.sent, notSent: !this.state.sent,
      submit: e => { e.preventDefault(); this.setState({ sent: true }); },
      reset: () => this.setState({ sent: false })
    };
  }
}
</script>
</body>
</html>
