<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"></helmet>
<footer style="font-family:'Plus Jakarta Sans',sans-serif;max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,48px) 32px">
  <div style="position:relative;overflow:hidden;background:#22105C;border-radius:20px;padding:clamp(32px,5vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:40px;color:#FFFFFF">
    <sc-for list="{{ pixels }}" as="p" hint-placeholder-count="0"><div style="position:absolute;right:{{p.r}}px;bottom:{{p.b}}px;width:{{p.s}}px;height:{{p.s}}px;border-radius:4px;background:{{p.c}}"></div></sc-for>
    <sc-if value="{{ showCta }}" hint-placeholder-val="{{ true }}">
      <div style="position:relative;display:flex;flex-direction:column;gap:16px;align-items:flex-start">
        <h2 style="margin:0;font-size:clamp(28px,3.4vw,40px);font-weight:700;letter-spacing:-0.02em;line-height:1.1;text-wrap:balance">Let’s build something fruitful together.</h2>
        <p style="margin:0;font-size:16px;line-height:1.6;color:#D9D3F2;max-width:420px">Have a project in mind? We’d love to hear about it and help bring your ideas to life.</p>
        <a href="contact.html" style="margin-top:8px;display:flex;align-items:center;gap:8px;background:#16A34A;color:#FFFFFF;text-decoration:none;font-size:15px;font-weight:500;padding:12px 20px;border-radius:10px" style-hover="background:#15803D">Get in touch <i class="ph ph-arrow-right"></i></a>
      </div>
    </sc-if>
    <div style="position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-content:start">
      <div style="display:flex;flex-direction:column;gap:12px">
        <span style="font-size:13px;font-weight:600;letter-spacing:0.08em;color:#A99EE0">PRODUCTS</span>
        <a href="quickgrab.html" style="color:#FFFFFF;text-decoration:none;font-size:15px" style-hover="color:#B9F0CB">QuickGrab</a>
        <a href="databits.html" style="color:#FFFFFF;text-decoration:none;font-size:15px" style-hover="color:#B9F0CB">DataBits</a>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <span style="font-size:13px;font-weight:600;letter-spacing:0.08em;color:#A99EE0">COMPANY</span>
        <a href="about.html" style="color:#FFFFFF;text-decoration:none;font-size:15px" style-hover="color:#B9F0CB">About</a>
        <a href="contact.html" style="color:#FFFFFF;text-decoration:none;font-size:15px" style-hover="color:#B9F0CB">Contact</a>
      </div>
    </div>
  </div>
  <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:24px 4px 0;font-size:13px;color:#64748B">
    <span>© 2026 RindWorks</span>
    <span>Fruitful software</span>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:420},&quot;showCta&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const P = [[24,24,22,'#3B2690'],[56,24,22,'#4A33A8'],[24,56,22,'#2E1B78'],[88,24,22,'#3B2690'],[56,56,22,'#5B44C0'],[24,88,22,'#4A33A8'],[130,30,14,'#3B2690'],[100,70,14,'#2E1B78'],[40,124,14,'#3B2690'],[170,22,10,'#2E1B78'],[20,160,10,'#2E1B78']];
    return { showCta: this.props.showCta ?? true, pixels: P.map(([r,b,s,c]) => ({ r, b, s, c })) };
  }
}
</script>
</body>
</html>
